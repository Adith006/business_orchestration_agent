
[project]
name = "business-orchestrator"
version = "0.1.0"
description = "AI-powered business orchestration and autonomous workforce platform"
requires-python = ">=3.13,<3.14"

dependencies = [
    "fastapi>=0.120,<1.0",
    "uvicorn[standard]>=0.38,<1.0",
    "pydantic>=2.12,<3.0",
    "pydantic-settings>=2.11,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.17,<2.0",
    "httpx>=0.28,<1.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/business_orchestrator"]


[dependency-groups]
dev = [
    "pytest>=8.3,<10.0",
    "pytest-asyncio>=1.0,<2.0",
    "ruff>=0.14,<1.0",
]


[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]


